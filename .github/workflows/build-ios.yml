name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Flutter iOS Application
    runs-on: macos-14
    steps:
      # 1. تنزيل كود المشروع
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا
      - name: ☕ Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. تثبيت بيئة Flutter
      - name: 💙 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. تثبيت مكاتب وحزم Flutter
      - name: 📦 Install Flutter Dependencies
        run: |
          flutter precache --ios
          flutter pub get

      # 5. تهيئة ملفات iOS والبناء بدون توقيع إلكتروني
      - name: 🔨 Build iOS App (Release, No Codesign)
        run: flutter build ios --release --no-codesign

      # 6. تجميع تطبيق iOS وحفظه بصيغة ملف .ipa
      - name: 📦 Package Unsigned Payload as IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r App_iOS.ipa Payload
          mkdir -p dist
          mv App_iOS.ipa dist/

      # 7. رفع ملف الـ IPA لتتمكن من تحميله من GitHub
      - name: 🚀 Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-iOS-IPA
          path: dist/App_iOS.ipa
          retention-days: 14

      # 8. رفع مجلد Runner.app لمن يريد تشغيله أو توقيعه
      - name: 🚀 Upload Runner.app Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-iOS-Runner-App
          path: build/ios/iphoneos/Runner.app
          retention-days: 14
